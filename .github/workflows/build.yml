   name: Build
   on: [push, workflow_dispatch]
   jobs:
     build:
       strategy:
         matrix:
           config:
             - { name: Windows, os: windows-latest }
       name: ${{ matrix.config.name }}
       runs-on: ${{ matrix.config.os }}
       steps:
         - uses: actions/checkout@v4
         - uses: geode-sdk/build-geode-mod@main
           with:
             combine: true
